spring.application.name=sistema-estacionamento

# Banco H2 armazenado em arquivo
spring.datasource.url=jdbc:h2:file:./dados/estacionamento
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Atualiza as tabelas sem apagar os registros existentes
spring.jpa.hibernate.ddl-auto=update

# Console para consultar o banco pelo navegador
spring.h2.console.enabled=true

server.address=0.0.0.0
server.port=8080

# Para rodar tambem no celular, substitua SEU-IP-AQUI pelo IP da sua rede IPV4.
app.url-base=http://SEU_IP_AQUI:8080