
spring.application.name=sistema-estacionamento

# Banco H2 com persistencia em arquivo
spring.datasource.url=jdbc:h2:file:./dados/estacionamento
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracao do JPA
spring.jpa.hibernate.ddl-auto=update

# Console H2
spring.h2.console.enabled=true

# Endereco para leitura do QR Code pelo celular
app.url-base=${APP_URL_BASE:http://localhost:8080}
