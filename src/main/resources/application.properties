spring.application.name=sistema-estacionamento

# Banco H2 armazenado em arquivo
spring.datasource.url=jdbc:h2:file:./dados/estacionamento
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Atualiza as tabelas sem apagar os registros existentes
spring.jpa.hibernate.ddl-auto=update

# Console para consultar o banco pelo navegador
spring.h2.console.enabled=true

# Endereco para leitura do QR Code pelo celular
app.url-base=${APP_URL_BASE:http://localhost:8080}