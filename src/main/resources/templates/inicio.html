<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento Digital</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

    <header class="topo">
        <div class="topo__interno">
            <span class="marca__logo" aria-hidden="true">P</span>
            <div>
                <p class="marca__titulo">Estacionamento Digital</p>
                <p class="marca__subtitulo">Protótipo Acadêmico — Engenharia de Software | UNA Aimorés</p>
            </div>
        </div>
    </header>

    <main class="conteudo conteudo--largo">
        <section class="painel" aria-labelledby="titulo-patio">

            <div class="painel__topo">
                <div>
                    <h1 class="painel__titulo" id="titulo-patio">Veículos no pátio</h1>
                    <p class="painel__contagem">
                        <span id="contador-patio">0</span> veículo(s) ativo(s)
                    </p>
                </div>
                <button type="button" class="botao botao--auto" id="botao-abrir-cadastro">Cadastrar veículo</button>
            </div>

            <p class="vazio" id="mensagem-vazio">
                Nenhum veículo no pátio. Use "Cadastrar veículo" para registrar uma entrada.
            </p>

            <!-- Os cards são criados pelo JavaScript a partir do modelo abaixo -->
            <div class="grade-veiculos" id="grade-veiculos"></div>

        </section>
    </main>

    <!-- MODAL: cadastro de veículo -->
    <dialog class="modal" id="modal-cadastro" aria-labelledby="titulo-cadastro">
        <form id="form-entrada" novalidate>
            <h2 class="modal__titulo" id="titulo-cadastro">Cadastrar veículo</h2>

            <label class="rotulo" for="placa">Digite a placa do veículo</label>

            <div class="placa">
                <span class="placa__faixa">BRASIL</span>
                <input class="placa__campo" type="text" id="placa" name="placa"
                       placeholder="ABC1D23" maxlength="8"
                       autocomplete="off" autocapitalize="characters" spellcheck="false">
            </div>

            <p class="mensagem" id="mensagem-cadastro" role="alert" hidden></p>

            <div class="modal__acoes">
                <button type="button" class="botao botao--secundario" id="botao-cancelar-cadastro">Cancelar</button>
                <button type="submit" class="botao" id="botao-entrada">Registrar entrada</button>
            </div>
        </form>
    </dialog>

    <!-- MODELO DO CARD: copiado pelo JavaScript para cada veículo -->
    <template id="modelo-card">
        <article class="veiculo">
            <header class="veiculo__topo">
                <span class="veiculo__placa" data-campo="placa"></span>
                <span class="selo" data-campo="statusVeiculo"></span>
            </header>

            <p class="veiculo__relogio" data-campo="relogio" aria-label="Tempo de permanência">00:00:00</p>

            <dl class="veiculo__dados">
                <div><dt>Entrada</dt><dd data-campo="entrada">—</dd></div>
                <div><dt>Tarifa</dt><dd data-campo="tarifa">—</dd></div>
                <div><dt>Pagamento</dt><dd data-campo="pagamento">—</dd></div>
            </dl>

            <button type="button" class="botao botao--secundario" data-acao="detalhes">Ver detalhes</button>
        </article>
    </template>

    <!-- Área das notificações de sucesso e erro -->
    <div class="avisos" id="avisos" aria-live="polite"></div>

    <script th:src="@{/js/painel.js}" defer></script>
</body>
</html>
