
# Banco H2 exclusivo para os testes
spring.datasource.url=jdbc:h2:mem:estacionamento_teste;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria as tabelas durante os testes
spring.jpa.hibernate.ddl-auto=create-drop

# URL utilizada durante os testes
app.url-base=http://localhost:8080
